name: Web

on:
  push:
    paths: ["web/**", "firestore.rules", "rules-tests/**", "package.json", "package-lock.json", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "firestore.rules", "rules-tests/**", "package.json", "package-lock.json", ".github/workflows/web.yml"]
  workflow_dispatch:

jobs:
  test:
    name: Probar lógica y reglas de privacidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Pruebas de la lógica
        run: npm --prefix web test
      - name: Pruebas de las reglas (emulador de Firestore)
        run: npm run test:rules
